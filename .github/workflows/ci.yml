name: CI - Testes de Unidade e E2E

on:
  push:
    branches: [ "main", "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  unit-tests:
    name: Testes de Unidade (JUnit 5 + Mockito)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permissão de execução ao Maven Wrapper
        run: chmod +x mvnw

      - name: Executar testes de unidade
        run: ./mvnw test -Dtest="!PescdApplicationTests" -Dsurefire.failIfNoSpecifiedTests=false

  e2e-tests:
    name: Testes Web E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Subir infraestrutura (PostgreSQL e SeaweedFS)
        run: |
          docker compose up -d
          for i in {1..30}; do
            if docker exec pescd-postgres pg_isready -U postgres -d pescd; then
              break
            fi
            sleep 2
          done
          sleep 3

      - name: Compilar e iniciar Backend (Spring Boot na porta 8082)
        run: |
          chmod +x mvnw
          nohup ./mvnw spring-boot:run > backend.log 2>&1 &
          for i in {1..60}; do
            if curl -sf http://localhost:8082/api/offers > /dev/null; then
              echo "Backend iniciado com sucesso na porta 8082."
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8082/api/offers > /dev/null

      - name: Instalar dependências e iniciar Frontend (React/Vite na porta 5173)
        working-directory: frontend
        run: |
          npm install
          nohup npm run dev -- --host 0.0.0.0 --port 5173 > ../frontend.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://localhost:5173 > /dev/null; then
              echo "Frontend iniciado com sucesso na porta 5173."
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:5173 > /dev/null

      - name: Instalar Playwright e executar testes E2E
        run: |
          if [ -d "e2e" ]; then
            cd e2e
            npm install
            npx playwright install --with-deps chromium
            npx playwright test
          else
            echo "Subprojeto /e2e ainda não presente nesta branch."
          fi

      - name: Exibir logs em caso de falha
        if: failure()
        run: |
          echo "=== Logs do Backend ==="
          tail -n 100 backend.log || true
          echo "=== Logs do Frontend ==="
          tail -n 100 frontend.log || true

      - name: Publicar relatório do Playwright
        if: always() && hashFiles('e2e/playwright-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
